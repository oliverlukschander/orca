name: Kaneo Windows rendered validation
on:
  push:
    branches: [ci/kaneo-platform-validation]
permissions:
  contents: read
jobs:
  windows-rendered:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: def473a2d9040caebe80913f4822daf4c5adf78a
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: electron
          persist-native-cache: 'false'
      - name: Build
        run: pnpm build
      - name: Rendered Kaneo checks
        run: pnpm exec playwright test tests/e2e/kaneo-smart-url.spec.ts tests/e2e/kaneo-paired-runtime.spec.ts --config tests/playwright.config.ts --project electron-headless --workers=1 --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaneo-windows-rendered
          path: |
            playwright-report
            test-results
          retention-days: 14
