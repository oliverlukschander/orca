name: Kaneo Windows LF validation
on:
  push:
    branches: [ci/kaneo-platform-validation]
permissions:
  contents: read
jobs:
  windows-lf:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: def473a2d9040caebe80913f4822daf4c5adf78a
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: node
      - name: Lint with LF checkout
        run: pnpm lint
      - name: Kaneo regression tests
        if: always()
        run: pnpm test kaneo
